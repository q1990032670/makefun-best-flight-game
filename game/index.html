<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyharbor Run — a valley flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Skyharbor Run: fly the gates over the river valley, then land on the home runway. Arrow keys or WASD steer, Shift and Control work the throttle."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
